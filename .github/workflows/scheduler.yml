# The pulse: every 5 minutes, check pipelines.json and run whatever is due.
# Your schedules live in pipelines.json - edit it from the console's
# SCHEDULES panel; never touch this file.
name: scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "'all' = run every enabled pipeline regardless of cron"
        default: ""

permissions:
  contents: write

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install requests

      - name: Check what's due
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: python scripts/scheduler.py --print-due-types | tee .due_types

      - name: Install browser runtime (only for browser pipelines)
        run: |
          if grep -qx "browser" .due_types; then
            pip install playwright
            python -m playwright install --with-deps chromium
          else
            echo "no browser pipelines due - skipping chromium install"
          fi

      - name: Run due pipelines
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          FORCE: ${{ github.event.inputs.force }}
        run: python scripts/scheduler.py

      - name: Persist scheduler heartbeat + journals
        if: always()
        run: |
          git config user.name "bot-scheduler"
          git config user.email "actions@users.noreply.github.com"
          git add -A state
          for f in logs/learning_journal.csv logs/daily_trend_state.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "scheduler: pass $(date -u '+%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push
          fi

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: scheduler-results-${{ github.run_id }}
          path: results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" -d text="🟠 scheduler pass had failures — $RUN_URL" > /dev/null || true
          fi
